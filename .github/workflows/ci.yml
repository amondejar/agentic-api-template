name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Packs the template, creates solutions with it, builds them with warnings as errors, runs their tests and
      # drives the running API like an AI agent.
      - name: End-to-end
        run: tests/run.sh

      - name: Pack
        run: |
          args=(-c Release -o artifacts)
          if [ -n "$PACKAGE_VERSION" ]; then args+=(-p:Version="$PACKAGE_VERSION"); fi
          dotnet pack src/AgenticApi.Templates "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
